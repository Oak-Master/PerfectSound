name: Device compatibility report
description: Report behavior on your own audio device without sharing private identifiers.
title: "[Device] "
body:
  - type: input
    id: model
    attributes:
      label: Device model and firmware
      placeholder: "Galaxy Buds FE, firmware version if known"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Windows and PerfectSound versions
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What did you try, and what happened?
      description: Include expected and actual behavior. Remove MAC addresses, endpoint IDs, serial numbers and personal paths.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed private identifiers from the report and attachments.
          required: true
